<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&amp;family=Syne+Mono&amp;display=swap');
      text { font-family: 'Syne', -apple-system, BlinkMacSystemFont, sans-serif; }
      .mono { font-family: 'Syne Mono', 'Courier New', monospace; }
    </style>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="overlay" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8f135" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c8f135" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="720" fill="#0a0a0a"/>
  <!-- Noise overlay -->
  <rect width="1200" height="720" fill="#fff" opacity="0.015" filter="url(#noise)"/>

  <!-- Browser chrome -->
  <rect width="1200" height="38" fill="#111" rx="0"/>
  <rect x="0" y="37" width="1200" height="1" fill="#1e1e1e"/>
  <!-- Traffic lights -->
  <circle cx="22" cy="19" r="5.5" fill="#ff5f57"/>
  <circle cx="40" cy="19" r="5.5" fill="#febc2e"/>
  <circle cx="58" cy="19" r="5.5" fill="#28c840"/>
  <!-- URL bar -->
  <rect x="200" y="9" width="800" height="20" fill="#1a1a1a" rx="4"/>
  <text x="600" y="23" text-anchor="middle" fill="#555" font-size="11" class="mono">henrymorgandibie.github.io/scrollbreak</text>

  <!-- App header -->
  <rect x="0" y="38" width="1200" height="56" fill="#0a0a0a"/>
  <rect x="0" y="93" width="1200" height="1" fill="#1e1e1e"/>
  <!-- Logo -->
  <text x="32" y="74" fill="#f0f0f0" font-size="15" font-weight="800" letter-spacing="4">SCROLL<tspan fill="#c8f135">BREAK</tspan></text>
  <!-- Sync + settings -->
  <text x="1050" y="73" fill="#c8f135" font-size="10" class="mono">🟢 synced</text>
  <rect x="1110" y="59" width="82" height="22" fill="none" stroke="#c8f135" stroke-width="1" rx="3"/>
  <text x="1151" y="74" text-anchor="middle" fill="#c8f135" font-size="10" letter-spacing="1">⚙ SETTINGS</text>

  <!-- Tabs -->
  <rect x="0" y="94" width="1200" height="44" fill="#0a0a0a"/>
  <rect x="0" y="137" width="1200" height="1" fill="#1e1e1e"/>
  <!-- Tab items -->
  <text x="36" y="121" fill="#c8f135" font-size="11" font-weight="700" letter-spacing="2">INTENTION</text>
  <rect x="24" y="136" width="90" height="2" fill="#c8f135"/>
  <text x="148" y="121" fill="#444" font-size="11" font-weight="700" letter-spacing="2">REFLECT</text>
  <text x="242" y="121" fill="#444" font-size="11" font-weight="700" letter-spacing="2">HISTORY</text>
  <text x="340" y="121" fill="#444" font-size="11" font-weight="700" letter-spacing="2">DASHBOARD</text>
  <text x="458" y="121" fill="#444" font-size="11" font-weight="700" letter-spacing="2">ANALYTICS</text>

  <!-- Main content area -->
  <!-- Hero -->
  <text x="600" y="195" text-anchor="middle" fill="#f0f0f0" font-size="36" font-weight="800">Why are you <tspan fill="#c8f135">opening</tspan> this?</text>
  <text x="600" y="220" text-anchor="middle" fill="#444" font-size="13">Set your intention before you scroll. 20 seconds. Real difference.</text>

  <!-- Platform grid -->
  <text x="32" y="258" fill="#444" font-size="10" font-weight="700" letter-spacing="3">PLATFORM</text>
  <!-- Chips -->
  <rect x="32" y="266" width="148" height="36" fill="#161616" stroke="#1e1e1e" rx="5"/>
  <text x="106" y="289" text-anchor="middle" fill="#444" font-size="11" font-weight="700" letter-spacing="1">TWITTER/X</text>

  <rect x="188" y="266" width="148" height="36" fill="#161616" stroke="#1e1e1e" rx="5"/>
  <text x="262" y="289" text-anchor="middle" fill="#444" font-size="11" font-weight="700" letter-spacing="1">INSTAGRAM</text>

  <rect x="344" y="266" width="148" height="36" fill="rgba(200,241,53,0.08)" stroke="#c8f135" rx="5"/>
  <text x="418" y="289" text-anchor="middle" fill="#c8f135" font-size="11" font-weight="700" letter-spacing="1">YOUTUBE</text>

  <rect x="500" y="266" width="148" height="36" fill="#161616" stroke="#1e1e1e" rx="5"/>
  <text x="574" y="289" text-anchor="middle" fill="#444" font-size="11" font-weight="700" letter-spacing="1">TIKTOK</text>

  <rect x="656" y="266" width="148" height="36" fill="#161616" stroke="#1e1e1e" rx="5"/>
  <text x="730" y="289" text-anchor="middle" fill="#444" font-size="11" font-weight="700" letter-spacing="1">REDDIT</text>

  <rect x="812" y="266" width="148" height="36" fill="#161616" stroke="#1e1e1e" rx="5"/>
  <text x="886" y="289" text-anchor="middle" fill="#444" font-size="11" font-weight="700" letter-spacing="1">NEWS</text>

  <!-- Intention label -->
  <text x="32" y="330" fill="#444" font-size="10" font-weight="700" letter-spacing="3">YOUR INTENTION</text>
  <!-- Textarea -->
  <rect x="32" y="338" width="928" height="64" fill="#161616" stroke="#c8f135" stroke-width="1" rx="5"/>
  <text x="48" y="360" fill="#f0f0f0" font-size="13">I want to watch one specific tutorial on dbt incremental models, then</text>
  <text x="48" y="378" fill="#f0f0f0" font-size="13">close the tab immediately after.</text>

  <!-- Time limit -->
  <text x="32" y="426" fill="#444" font-size="10" font-weight="700" letter-spacing="3">TIME LIMIT</text>
  <rect x="32" y="434" width="72" height="28" fill="rgba(200,241,53,0.06)" stroke="#c8f135" rx="3"/>
  <text x="68" y="452" text-anchor="middle" fill="#c8f135" font-size="11" class="mono">20 min</text>
  <rect x="114" y="434" width="72" height="28" fill="#161616" stroke="#1e1e1e" rx="3"/>
  <text x="150" y="452" text-anchor="middle" fill="#444" font-size="11" class="mono">30 min</text>
  <rect x="196" y="434" width="72" height="28" fill="#161616" stroke="#1e1e1e" rx="3"/>
  <text x="232" y="452" text-anchor="middle" fill="#444" font-size="11" class="mono">45 min</text>

  <!-- CTA Button -->
  <rect x="32" y="476" width="928" height="42" fill="#c8f135" rx="4"/>
  <text x="496" y="502" text-anchor="middle" fill="#000" font-size="13" font-weight="800" letter-spacing="2">SET INTENTION + GET COACHING</text>

  <!-- AI Response box -->
  <rect x="32" y="534" width="928" height="130" fill="#161616" stroke="#1e1e1e" rx="5"/>
  <rect x="32" y="534" width="3" height="130" fill="#c8f135" rx="1"/>
  <text x="48" y="556" fill="#c8f135" font-size="9" font-weight="700" letter-spacing="3">🤖  LLAMA VIA GROQ</text>

  <text x="48" y="578" fill="#f0f0f0" font-size="13">Your intention is impressively specific — "one tutorial on dbt incremental models" gives you a clear finish line, which</text>
  <text x="48" y="598" fill="#f0f0f0" font-size="13">is exactly what keeps YouTube sessions from spiraling. The only risk here is the autoplay queue that kicks in the</text>
  <text x="48" y="618" fill="#f0f0f0" font-size="13">second your video ends. Practical tip: pause the video at the 15-minute mark, ask yourself if you've gotten what</text>
  <text x="48" y="638" fill="#f0f0f0" font-size="13">you came for, and close the tab before autoplay decides your next 40 minutes for you.</text>

  <!-- Bottom label -->
  <text x="600" y="700" text-anchor="middle" fill="#2a2a2a" font-size="11" class="mono">scrollbreak · groq llama-3.3-70b-versatile · henrymorgandibie.github.io/scrollbreak</text>
</svg>
